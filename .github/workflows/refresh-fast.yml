name: "Fast refresh (Pipeline Gen Day)"

# Hit "Run workflow" on a Pipeline Generation Day morning. The job loops
# for ~8 hours, refreshing every 15 minutes — no dependency on GitHub's
# unreliable cron scheduler.
#
# To stop it early: Actions → click the running workflow → Cancel workflow.

on:
  workflow_dispatch: {}       # manual trigger only — no cron

permissions:
  contents: write

concurrency:
  group: refresh-fast
  cancel-in-progress: true    # re-triggering restarts the 8-hour window

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 500      # ~8h20m safety net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh loop (every 15 min for ~8 hours)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          LOOKBACK_DAYS: "420"
          TIMEZONE: "Europe/London"
          REP_NAMES: "Tyreek Burke,Jennifer Fasida,Liam Bolger-Prentice,Zoe Cornelius,Miles Smith,George Watson,Henry McCloskey,Hamid Abusibah,Nathan Brown,Darien Bryan"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ITERATIONS=32   # 32 × 15 min = 8 hours
          for i in $(seq 1 $ITERATIONS); do
            echo "──── Refresh $i/$ITERATIONS  $(date -u +%Y-%m-%dT%H:%M:%SZ) ────"

            # Pull latest to avoid push conflicts
            git pull origin main --no-rebase -X theirs || true

            # Fetch fresh data from HubSpot
            python scripts/fetch_hubspot.py || { echo "Fetch failed, will retry next cycle"; sleep 900; continue; }

            # Commit and push if changed
            git add data/data.json
            if git diff --staged --quiet; then
              echo "No changes to commit."
            else
              git commit -m "chore: fast refresh HubSpot data ($(date -u +%Y-%m-%dT%H:%M))"
              git push || echo "Push failed, will retry next cycle"
            fi

            # Sleep 15 min (unless this is the last iteration)
            if [ "$i" -lt "$ITERATIONS" ]; then
              echo "Sleeping 15 minutes…"
              sleep 900
            fi
          done
          echo "Done — 8-hour fast refresh window complete."
