name: "Fast refresh (weekdays 8am–6pm UK)"

# Runs automatically Mon-Fri. Also supports manual trigger.
# The job loops every 15 minutes for 10 hours (8am → 6pm).
# To stop it early: Actions → click the running workflow → Cancel workflow.

on:
  schedule:
    # 07:00 UTC = 08:00 BST (summer) / 07:00 GMT (winter).
    # During GMT months this starts at 7am UK — close enough.
    - cron: "0 7 * * 1-5"    # Mon-Fri at 07:00 UTC
  workflow_dispatch: {}        # allow manual trigger too

permissions:
  contents: write

concurrency:
  group: refresh-fast
  cancel-in-progress: true     # re-triggering restarts the window

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 650       # ~10h50m safety net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh loop (every 15 min for 10 hours)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          LOOKBACK_DAYS: "420"
          TIMEZONE: "Europe/London"
          REP_NAMES: "Tyreek Burke,Jennifer Fasida,Liam Bolger-Prentice,Zoe Cornelius,Miles Smith,George Watson,Henry McCloskey,Hamid Abusibah,Nathan Brown,Darien Bryan"
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ITERATIONS=40   # 40 × 15 min = 10 hours (8am → 6pm)
          for i in $(seq 1 $ITERATIONS); do
            echo "──── Refresh $i/$ITERATIONS  $(date -u +%Y-%m-%dT%H:%M:%SZ) ────"

            # Fetch fresh data from HubSpot
            python scripts/fetch_hubspot.py
            if [ $? -ne 0 ]; then
              echo "Fetch failed, will retry next cycle"
              sleep 900
              continue
            fi

            # Commit first, then pull remote changes, then push
            git add data/data.json
            if git diff --staged --quiet; then
              echo "No changes to commit."
            else
              git commit -m "chore: fast refresh HubSpot data ($(date -u +%Y-%m-%dT%H:%M))"
              git pull origin main --no-rebase -X ours || true
              git push || echo "Push failed, will retry next cycle"
            fi

            # Sleep 15 min (unless this is the last iteration)
            if [ "$i" -lt "$ITERATIONS" ]; then
              echo "Sleeping 15 minutes…"
              sleep 900
            fi
          done
          echo "Done — 10-hour fast refresh window complete."
