name: "Fast refresh (weekdays 8am–6pm UK)"

# Runs automatically Mon-Fri at 7am UTC (~8am UK).
# Loops every 15 minutes for 10 hours, then stops.
# Manual trigger: Actions tab → Run workflow.
# Stop early: Actions → click running workflow → Cancel workflow.

on:
  schedule:
    - cron: "0 7 * * 1-5"    # Mon-Fri at 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-fast
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 650
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh loop
        shell: bash --noprofile --norc {0}
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          LOOKBACK_DAYS: "420"
          TIMEZONE: "Europe/London"
          REP_NAMES: "Tyreek Burke,Jennifer Fasida,Liam Bolger-Prentice,Zoe Cornelius,Miles Smith,George Watson,Henry McCloskey,Darien Bryan"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ITERATIONS=40

          i=1
          while [ "$i" -le "$ITERATIONS" ]; do
            echo ""
            echo "========================================"
            echo "  Refresh $i/$ITERATIONS  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "========================================"

            echo "[1/4] Fetching HubSpot data…"
            if python scripts/fetch_hubspot.py; then
              echo "[2/4] Fetch succeeded."
            else
              echo "[2/4] Fetch FAILED (exit $?). Will retry next cycle."
              echo "[SLEEP] Sleeping 15 minutes…"
              i=$((i + 1))
              sleep 900
              continue
            fi

            echo "[3/4] Committing…"
            git add data/data.json

            CHANGED=0
            git diff --staged --quiet || CHANGED=1

            if [ "$CHANGED" -eq 1 ]; then
              git commit -m "chore: fast refresh HubSpot data ($(date -u +%Y-%m-%dT%H:%M))" || echo "Commit failed"
              echo "[3/4] Pulling remote…"
              git pull origin main --no-rebase -X ours || echo "Pull failed, continuing anyway"
              echo "[4/4] Pushing…"
              git push || echo "Push failed, will retry next cycle"
            else
              echo "[3/4] No changes to commit."
            fi

            if [ "$i" -lt "$ITERATIONS" ]; then
              echo "[SLEEP] Sleeping 15 minutes… (next: $((i+1))/$ITERATIONS)"
              sleep 900
            fi

            i=$((i + 1))
          done

          echo ""
          echo "Done — $ITERATIONS iterations complete."
